name: Run Telegram Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-dependencies: true
          install-chromedriver: true

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install python-telegram-bot selenium

      - name: Check Chrome and Selenium
        run: |
          google-chrome --version || chrome --version
          python --version
          python -c "import selenium; print('Selenium:', selenium.__version__)"
          python -c "import telegram; print('Telegram:', telegram.__version__)"

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python onam_bot_upi_option.py
