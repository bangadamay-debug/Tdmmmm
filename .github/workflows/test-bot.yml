name: Test Telegram Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Google Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-telegram-bot selenium

      - name: Check Chrome
        run: |
          google-chrome --version || chrome --version
          python --version
          python -c "import selenium; print('Selenium:', selenium.__version__)"
          python -c "import telegram; print('python-telegram-bot:', telegram.__version__)"

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "ERROR: BOT_TOKEN GitHub secret is not configured."
            exit 1
          fi
          python onam_bot_pydroid.py
