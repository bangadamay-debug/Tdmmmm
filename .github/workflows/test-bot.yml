name: Run Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-telegram-bot selenium

      - name: Run diagnostic bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python onam_bot_diagnostic.py

      - name: Upload Selenium diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-diagnostics
          path: |
            selenium_diagnostic.png
            selenium_diagnostic.html
          if-no-files-found: warn
